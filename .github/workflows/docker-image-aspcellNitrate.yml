name: Build and publish Shiny image

on:
  push:
    branches: ["main"]
    paths:
      - "aspcell_nitrate/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Docker builder
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and upload image
        uses: docker/build-push-action@v6
        with:
          context: ./aspcell_nitrate
          file: ./aspcell_nitrate/Dockerfile
          platforms: linux/amd64
          push: true
          tags: shruti281989/aspcell_nitrate:build-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Display image address
        run: |
          echo 'Image: `shruti281989/aspcell_nitrate:build-${{ github.run_number }}`' >> "$GITHUB_STEP_SUMMARY"

